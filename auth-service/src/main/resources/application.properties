# Server Configuration
server.port=8081
spring.application.name=auth-service

# Database Configuration (PostgreSQL - współdzielona baza mafia)
spring.datasource.url=jdbc:postgresql://db:5432/mafia
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Configuration (współdzielony secret z game-service)
jwt.secret=VhUiBCj6kd1Ikwb0CrjgLBWxrW7zVFwqL+IGNnkJtrLXQW4lcZQcxBUyjEVYSLirHrqhUeaipaP8YwjO2+e0Vw==
jwt.expiration=60000

# JWT Refresh Token Configuration
jwt.refresh-expiration=604800000
jwt.max-refresh-tokens-per-user=5

# Logging Configuration
logging.level.com.mafia.auth=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
