# Server Configuration
server.port=8080
spring.application.name=game-service

# Database Configuration (PostgreSQL - współdzielona baza mafia)
spring.datasource.url=jdbc:postgresql://localhost:5432/mafia
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Configuration (współdzielony secret z auth-service)
jwt.secret=VhUiBCj6kd1Ikwb0CrjgLBWxrW7zVFwqL+IGNnkJtrLXQW4lcZQcxBUyjEVYSLirHrqhUeaipaP8YwjO2+e0Vw==
jwt.expiration=60000

# Enable scheduled tasks
spring.task.scheduling.enabled=false

# Logging Configuration
logging.level.com.mafia=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application Specific Configuration
app.frontend.joinPath=/join/

# CORS Configuration - Frontend URL (czyta ze zmiennej środowiskowej z .env)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false
springdoc.override-with-generic-response=false

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized